# Render Blueprint for WonderPlay.
# Docs: https://render.com/docs/blueprint-spec
#
# The database is hosted on Neon (https://neon.tech, free, no expiry).
# Render asks for DATABASE_URL and APP_PASSWORD when you apply the Blueprint
# (or set them later under the service's Environment tab).
#
# Plan: "free" sleeps after 15 minutes idle and loses cached album art on each
# restart. "starter" is always on; with it you can also keep album art on a disk:
#   plan: starter
#   disk:
#     name: wonderplay-data
#     mountPath: /var/data
#     sizeGB: 1

services:
  - type: web
    name: wonderplay
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false          # paste your Neon connection string (see DEPLOY.md)
      - key: APP_PASSWORD
        sync: false          # the password you'll use to sign in
      - key: SECRET_KEY
        generateValue: true
      - key: AUTO_MIGRATE
        value: "true"
      - key: SCAN_ON_STARTUP
        value: "false"
      # Route YouTube through Cloudflare WARP (free) to avoid "confirm you're
      # not a bot" on data-centre IPs. Falls back to direct automatically.
      - key: WARP_PROXY
        value: "true"
      - key: YTDLP_JS_RUNTIME
        value: node
      - key: YTDLP_PLAYER_CLIENTS
        value: tv_samsung
      - key: YTDLP_PLAYER_JS_VARIANT
        value: actual
      # Optional: upload a cookies.txt as a Secret File named cookies.txt
      # (see DEPLOY.md, step 8), then this path points at it.
      - key: YTDLP_COOKIES_FILE
        value: /etc/secrets/cookies.txt
